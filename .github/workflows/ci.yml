# CI (INFRA §5.1, TESTING §4): lint, migraciones, pruebas con cobertura y build.
# Los jobs `backend` y `frontend` son checks obligatorios para fusionar en `main`, y Render
# solo despliega cuando pasan (autoDeployTrigger: checksPass).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Solo el Postgres del job: CI nunca usa Supabase ni secretos de producción (TESTING §4)
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/postgres
      DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/postgres
      SUPABASE_URL: https://edr-test.supabase.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (Flake8 y Black)
        run: |
          flake8
          black --check .
      - name: Migraciones sobre BD limpia
        run: alembic upgrade head
      - name: Pruebas con cobertura mínima
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint y formato
        run: |
          npm run lint
          npm run format:check
      - name: Pruebas
        run: npm test
      - name: Build
        run: npm run build
