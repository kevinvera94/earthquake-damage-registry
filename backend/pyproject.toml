[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette 1.x prefiere el paquete `httpx2`; con `httpx` (TESTING §2) solo avisa
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
